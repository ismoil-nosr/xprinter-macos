<h1>Open Xprinter</h1><p>适用于 XP-330B 的开源 USB 驱动和标签打印应用，支持 macOS 14 及以上、Intel 和 Apple Silicon。</p>
<p>安装完成后，连接打印机，在“应用程序”中打开 <strong>Open Xprinter</strong>。选择实际装入的标签尺寸，并保存为其他应用的默认设置。</p>
<p>初始尺寸为 <strong>58 × 40 毫米</strong>，间隙为 2 毫米。请按实际纸张调整。应用支持条形码、二维码、PDF、图片和 CSV。</p>
<p>在应用右上角可选择语言：<strong>English · Русский · 简体中文</strong>。</p>
<p>安装本地打印驱动需要管理员权限，不需要联网。已有打印机队列会保留。</p>
</html>
