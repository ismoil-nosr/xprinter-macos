<h1>开始设置标签打印</h1><ol><li>连接并打开 XP-330B。</li><li>在“应用程序”中打开 <strong>Open Xprinter</strong>，在右上角选择语言。</li><li>选择标签尺寸、纸张类型和间隙高度。需要时点击 <strong>设置打印机</strong>，然后点击 <strong>保存为其他应用的默认设置…</strong>。</li><li>先打印一张，检查对齐和条码可读性，再批量打印。</li></ol>
<p>在其他应用中选择 <strong>Xprinter XP-330B Labels (Open Source)</strong> 及匹配的纸张尺寸。</p>
