name: Build, test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: open-xprinter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Build universal installer
        run: ./scripts/build.sh
      - name: Test rendering, driver, setup and package
        run: ./scripts/test.sh
      - name: Fresh Mac installation without USB and reinstall
        run: ./tests/test_installation.sh
      - name: Upload package and validation reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Open-Xprinter-${{ matrix.os }}
          path: |
            dist/*.pkg
            build/tests/*.json
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Diagnostics-${{ matrix.os }}
          path: build/tests/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Open-Xprinter-macos-26
          path: release-artifacts
      - name: Publish unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-artifacts/dist
          sha256sum *.pkg > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.pkg SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Open Xprinter $GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/docs/RELEASE-NOTES.md"
