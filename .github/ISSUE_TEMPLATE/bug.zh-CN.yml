name: 打印或安装问题（中文）
description: 报告可复现的 XP-330B 问题。请勿提供私密标签或个人信息。
body:
  - type: input
    id: version
    attributes:
      label: Open Xprinter 版本
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本与 CPU（Apple Silicon / Intel）
    validations:
      required: true
  - type: input
    id: stock
    attributes:
      label: 标签宽度 × 进纸方向高度、间隙 / 黑标高度及纸张类型
      description: 标签和间隙需分别测量。如已知，请附上固件版本。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 预期结果、实际结果与复现步骤
      description: 请使用合成示例。不要上传客户标签、USB 序列号、账户信息或密码。
    validations:
      required: true
