name: Security
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
  codeql:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            os: macos-14
            build-mode: manual
          - language: swift
            os: macos-14
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: actions
            os: ubuntu-latest
            build-mode: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the security gate against driver and extension SARIF formats
        run: python3 .github/scripts/test-check-codeql.py
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Trace the production CUPS filter
        if: matrix.language == 'c-cpp'
        run: xcrun clang -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations -O2 src/filter/rastertoxp330b.c -lcups -o "$RUNNER_TEMP/rastertoxp330b"
      - name: Trace the production Swift app and renderer
        if: matrix.language == 'swift'
        run: |
          xcrun swiftc -swift-version 5 -Onone -target "$(uname -m)-apple-macosx14.0" \
            src/app/Localization.swift src/app/LabelRenderer.swift src/app/MCPRenderer.swift src/app/XprinterLabels.swift \
            -o "$RUNNER_TEMP/OpenXprinter" -framework AppKit -framework SwiftUI -framework CoreImage -framework PDFKit -framework Vision
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Block high and critical findings
        run: python3 .github/scripts/check-codeql.py codeql-results
